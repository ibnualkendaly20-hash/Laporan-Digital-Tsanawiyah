<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Digital Tsanawiyah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">Laporan Digital Tsanawiyah</h2>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" id="username" placeholder="Masukkan Username dari Admin" required class="w-full mt-1 p-2 border rounded-md focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" placeholder="Masukkan Password" required class="w-full mt-1 p-2 border rounded-md focus:ring-blue-500 focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition">Masuk</button>
        </form>

        <p id="message" class="mt-4 text-center text-sm font-medium"></p>
    </div>

    <script>
        const SUPABASE_URL = 'https://xojowaoabsllfzpskvgt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhvam93YW9hYnNsbGZ6cHNrdmd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NDc0NzIsImV4cCI6MjEwMjQyMzQ3Mn0._3mRQIIuDEYzcUXTQaCf4kH4voo0skRwt4iOoWKDt-4'; 
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const messageEl = document.getElementById('message');

            messageEl.textContent = 'Memeriksa akun...';
            messageEl.className = 'mt-4 text-center text-sm font-medium text-gray-600';

            // Cek data pengguna langsung ke tabel custom 'users'
            const { data: users, error } = await _supabase
                .from('users')
                .select('*')
                .eq('username', usernameInput)
                .eq('password', passwordInput)
                .single();

            if (error || !users) {
                messageEl.textContent = 'Login Gagal: Username atau Password salah!';
                messageEl.className = 'mt-4 text-center text-sm font-medium text-red-600';
            } else {
                // Simpan sesi login lokal di browser
                localStorage.setItem('user_session', JSON.stringify(users));

                messageEl.textContent = `Login Berhasil! Selamat datang, ${users.nama_lengkap} (${users.role}).`;
                messageEl.className = 'mt-4 text-center text-sm font-medium text-green-600';
                
                // Nanti diredirect ke Dashboard sesuai Role
            }
        });
    </script>
</body>
</html>
